name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  duckdb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt-version: ["1.7.*", "1.8.*", "1.9.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        working-directory: integration_tests
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-duckdb==${{ matrix.dbt-version }}"
      - name: dbt deps
        working-directory: integration_tests
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/integration_tests
        run: dbt deps
      - name: dbt seed + run + test
        working-directory: integration_tests
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/integration_tests
        run: dbt build
